<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الرواتب الإلكترونية</title>
<style>
body{
    margin:0;
    font-family:Arial;
    background-color:#eef7ff;
}
.header{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    padding:20px;
    border-bottom:1px solid #cfcfcf;
    background-color:#eef7ff;
}
.logout{
    position:absolute;
    top:80px;
    left:20px;
}
.logout button{
    background-color:#d9ecff;
    border:1px solid #b0cfe6;
    padding:10px 20px;
    cursor:pointer;
}
.sidebar{
    position:fixed;
    right:0;
    top:0;
    width:150px;
    height:100%;
    background-color:#d9ecff;
    border-left:1px solid #c0d8ea;
}
.sidebar a{
    display:block;
    text-decoration:none;
    color:black;
    text-align:center;
    padding:30px 0;
    font-size:20px;
}
.sidebar a:hover{
    background-color:#c7e3f7;
}
.content{
    text-align:center;
    margin-top:80px;
    margin-right:150px;
}
.content h1{
    font-size:40px;
}
.content h2{
    font-size:30px;
}
</style>
</head>
<body>
<div class="header">
    الرواتب الإلكترونية
</div>
<div class="logout">
    <button>تسجيل الخروج</button>
</div>
<div class="sidebar">
    <a href="aqsam.html">الأقسام</a>
</div>
<div class="content">
    <h1>أهلاً بك</h1>
</div>
</body>
</html>
